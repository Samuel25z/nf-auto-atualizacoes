<title>NF-Auto — Quem está online</title>
<style>
  :root {
    --bg: #0f0e17;
    --bg2: #17151f;
    --card: #1c1a26;
    --line: #2a2733;
    --line-strong: #3a3646;
    --txt: #f0eef5;
    --mut: #9b96ab;
    --mut-fraco: #6b6779;
    --acento: #7d0acf;
    --acento-fraco: color-mix(in oklab, #7d0acf 18%, transparent);
    --ok: #22c55e;
    --ok-fraco: color-mix(in oklab, #22c55e 16%, transparent);
    --off: #6b7280;
    --off-fraco: color-mix(in oklab, #6b7280 14%, transparent);
    --sombra: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  }
  :root[data-theme="light"] {
    --bg: #f7f5fb;
    --bg2: #ffffff;
    --card: #ffffff;
    --line: #e6e2ef;
    --line-strong: #d4cee3;
    --txt: #1c1730;
    --mut: #6b6480;
    --mut-fraco: #9a93ac;
    --acento: #7d0acf;
    --acento-fraco: color-mix(in oklab, #7d0acf 10%, transparent);
    --ok: #16a34a;
    --ok-fraco: color-mix(in oklab, #16a34a 12%, transparent);
    --off: #6b7280;
    --off-fraco: color-mix(in oklab, #6b7280 10%, transparent);
    --sombra: 0 1px 2px rgba(20,10,40,.06), 0 8px 24px rgba(20,10,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0e17; --bg2: #17151f; --card: #1c1a26; --line: #2a2733;
      --line-strong: #3a3646; --txt: #f0eef5; --mut: #9b96ab; --mut-fraco: #6b6779;
      --ok: #22c55e; --off: #6b7280; --sombra: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font-family: -apple-system, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    min-height: 100vh; padding: 32px 20px 60px;
  }
  .num { font-variant-numeric: tabular-nums; font-family: "SF Mono", "Cascadia Code", Consolas, monospace; }

  .wrap { max-width: 760px; margin: 0 auto; }

  header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 26px;
  }
  h1 {
    font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -.01em;
    text-wrap: balance;
  }
  h1 span { color: var(--mut); font-weight: 500; }
  .sub { color: var(--mut); font-size: 13px; margin-top: 4px; }

  .contagem {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 16px; border-radius: 999px;
    background: var(--ok-fraco); border: 1px solid color-mix(in oklab, var(--ok) 30%, transparent);
    font-size: 14px; font-weight: 600; color: var(--ok);
    white-space: nowrap;
  }
  .contagem .bolinha {
    width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
    box-shadow: 0 0 0 0 color-mix(in oklab, var(--ok) 60%, transparent);
    animation: pulso 2s ease-in-out infinite;
  }
  @keyframes pulso {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--ok) 45%, transparent); }
    50% { box-shadow: 0 0 0 5px transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .contagem .bolinha { animation: none; } }

  .lista { display: flex; flex-direction: column; gap: 10px; }

  .cartao {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px; box-shadow: var(--sombra);
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
  }
  .cartao.offline { opacity: .62; }

  .status-dot {
    width: 10px; height: 10px; border-radius: 50%; margin-top: 2px;
    background: var(--off);
  }
  .cartao.online .status-dot {
    background: var(--ok);
    box-shadow: 0 0 0 3px var(--ok-fraco);
  }

  .info-principal { min-width: 0; }
  .linha-topo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 3px; }
  .maquina { font-weight: 600; font-size: 14.5px; }
  .op {
    font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: var(--acento-fraco); color: var(--acento); font-weight: 600;
  }
  .op .num { font-family: inherit; }
  .notas {
    font-size: 11.5px; padding: 2px 8px; border-radius: 999px;
    background: var(--ok-fraco); color: var(--ok); font-weight: 600;
    cursor: help;
  }
  .meta { font-size: 12.5px; color: var(--mut); display: flex; gap: 10px; flex-wrap: wrap; }
  .meta b { color: var(--mut); font-weight: 600; }

  .lado-direito { text-align: right; white-space: nowrap; }
  .rotulo-status {
    font-size: 12.5px; font-weight: 700; letter-spacing: .01em;
  }
  .cartao.online .rotulo-status { color: var(--ok); }
  .cartao.offline .rotulo-status { color: var(--mut-fraco); }
  .visto { font-size: 11.5px; color: var(--mut-fraco); margin-top: 2px; }

  .vazio, .erro {
    text-align: center; padding: 60px 20px; color: var(--mut);
    border: 1px dashed var(--line-strong); border-radius: 14px; font-size: 14px;
  }
  .erro { color: color-mix(in oklab, #ef4444 70%, var(--txt)); border-color: color-mix(in oklab, #ef4444 30%, var(--line-strong)); }

  footer {
    text-align: center; margin-top: 28px; font-size: 12px; color: var(--mut-fraco);
  }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>NF-Auto <span>· quem está usando</span></h1>
      <div class="sub" id="subtitulo">carregando…</div>
    </div>
    <div class="contagem" id="contagem" style="display:none">
      <span class="bolinha"></span>
      <span id="contagemTexto">0 online agora</span>
    </div>
  </header>

  <div class="lista" id="lista">
    <div class="vazio">Carregando…</div>
  </div>

  <footer>Atualiza sozinho a cada 5 segundos</footer>
</div>

<script>
  const URL_BASE = 'https://base-validador-wynk-default-rtdb.firebaseio.com';
  const JANELA_ONLINE_MS = 90 * 1000; // sem sinal há mais que isso = offline

  function tempoDecorrido(ms) {
    const s = Math.floor(ms / 1000);
    if (s < 60) return 'agora mesmo';
    const m = Math.floor(s / 60);
    if (m < 60) return `há ${m} min`;
    const h = Math.floor(m / 60);
    if (h < 24) return `há ${h}h`;
    return `há ${Math.floor(h / 24)}d`;
  }

  function render(dados) {
    const lista = document.getElementById('lista');
    const sub = document.getElementById('subtitulo');
    const chip = document.getElementById('contagem');
    const chipTexto = document.getElementById('contagemTexto');

    const entradas = Object.entries(dados || {}).map(([id, v]) => ({ id, ...v }));
    if (!entradas.length) {
      lista.innerHTML = '<div class="vazio">Ninguém usou o sistema ainda.</div>';
      sub.textContent = 'nenhum registro';
      chip.style.display = 'none';
      return;
    }

    const agora = Date.now();
    entradas.forEach((e) => { e.online = (agora - (e.hora || 0)) < JANELA_ONLINE_MS; });
    entradas.sort((a, b) => (b.online - a.online) || (b.hora - a.hora));

    const qtdOnline = entradas.filter((e) => e.online).length;
    chip.style.display = 'inline-flex';
    chipTexto.textContent = `${qtdOnline} online agora`;
    const totalHoje = entradas.reduce((a, e) => a + (e.notasHoje || 0), 0);
    sub.textContent = `${entradas.length} instalação(ões) já vista(s) · ${totalHoje} nota${totalHoje === 1 ? '' : 's'} confirmada${totalHoje === 1 ? '' : 's'} hoje (todos)`;

    lista.innerHTML = entradas.map((e) => {
      const sites = Array.isArray(e.sites) ? e.sites.length : 0;
      const notasHoje = e.notasHoje || 0;
      const notasTotal = e.notasTotal || 0;
      return `
        <div class="cartao ${e.online ? 'online' : 'offline'}">
          <div class="status-dot"></div>
          <div class="info-principal">
            <div class="linha-topo">
              <span class="maquina">${escapa(e.maquina || 'máquina desconhecida')}</span>
              ${e.operador ? `<span class="op num">operador ${escapa(e.operador)}</span>` : ''}
              <span class="notas num" title="Só conta o que o robô viu o site aceitar de verdade">
                ${notasHoje} hoje · ${notasTotal} no total
              </span>
            </div>
            <div class="meta">
              <span><b>${sites}</b> shopping${sites === 1 ? '' : 's'} ativo${sites === 1 ? '' : 's'}</span>
              <span>${e.ultimaConfirmacao ? `última nota: ${tempoDecorrido(agora - e.ultimaConfirmacao)}` : 'nenhuma nota confirmada ainda'}</span>
              ${e.versao ? `<span>v${escapa(e.versao)}</span>` : ''}
            </div>
          </div>
          <div class="lado-direito">
            <div class="rotulo-status">${e.online ? 'ONLINE' : 'OFFLINE'}</div>
            <div class="visto num">${e.online ? 'agora' : tempoDecorrido(agora - (e.hora || 0))}</div>
          </div>
        </div>`;
    }).join('');
  }

  function escapa(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  }

  async function atualizar() {
    try {
      const resp = await fetch(`${URL_BASE}/presenca.json`, { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const dados = await resp.json();
      render(dados);
    } catch (e) {
      document.getElementById('lista').innerHTML =
        `<div class="erro">Não consegui carregar agora. Tentando de novo em 5s… (${escapa(e.message)})</div>`;
    }
  }

  atualizar();
  setInterval(atualizar, 5000);
</script>
